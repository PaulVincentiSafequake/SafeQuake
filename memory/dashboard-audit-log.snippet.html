<!--
  QuakeGuard — Audit log widget.

  Drops a live-updating audit feed onto the dashboard, showing the last N
  triggers and device status changes interleaved by timestamp.

  HOW TO USE
  ----------
  1. Paste this entire block anywhere on your safequake.onrender.com dashboard.
  2. Replace QUAKEGUARD_BACKEND with your deployed backend URL. No trailing /.
     Example: "https://quake-alert-18.emergent.host"
  3. It polls GET /api/audit every 10 seconds. Adjust POLL_MS below if needed.
  4. Requires CORS on the backend (already configured for
     https://safequake.onrender.com and http://localhost:*).

  BACKEND ENDPOINT
  ----------------
  GET {QUAKEGUARD_BACKEND}/api/audit?limit=100
    → { count, generated_at, events: [
        { kind: "trigger", at, idempotency_key, triggered_by, magnitude,
          recipients_total, ios_count, android_count, delivered, error },
        { kind: "status",  at, device_id, status, severity, latitude,
          longitude, accuracy_m, battery_pct, battery_state, platform },
        ... ]
      }
-->

<style>
  #qg-audit {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 820px;
    margin: 20px 0;
  }
  #qg-audit .qg-audit-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  #qg-audit h3 {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
    color: #222;
  }
  #qg-audit .qg-audit-meta {
    font-size: 12px;
    color: #888;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #qg-audit .qg-export-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  #qg-audit .qg-export-btn {
    padding: 5px 11px;
    background: #fff;
    border: 1px solid #cbd0d8;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    color: #333;
    cursor: pointer;
    font-family: inherit;
  }
  #qg-audit .qg-export-btn:hover:not(:disabled) { background:#f0f2f6; border-color:#a8b0bd; }
  #qg-audit .qg-export-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #qg-audit .qg-export-range {
    padding: 4px 8px;
    border: 1px solid #cbd0d8;
    border-radius: 4px;
    font-size: 12px;
    font-family: inherit;
  }
  #qg-audit .qg-export-msg {
    font-size: 12px;
    color: #666;
    margin-left: 6px;
  }
  #qg-audit .qg-export-msg.error   { color: #b0141a; }
  #qg-audit .qg-export-msg.success { color: #1a7f37; }
  #qg-audit .qg-audit-row {
    background: #fff;
    border: 1px solid #e6e6ea;
    border-left-width: 4px;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  #qg-audit .qg-audit-row.trigger         { border-left-color: #C21818; }
  #qg-audit .qg-audit-row.status          { border-left-color: #4A90E2; }
  #qg-audit .qg-audit-row.rescued         { border-left-color: #1F8A3A; background: #f7fdf9; }
  #qg-audit .qg-audit-row.rescue_reverted { border-left-color: #EA9500; background: #fff8ec; }
  #qg-audit .qg-audit-title { font-weight: 700; font-size: 14px; color: #222; }
  #qg-audit .qg-audit-at {
    color: #888;
    font-size: 11px;
    margin-top: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #qg-audit .qg-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    margin-left: 6px;
    vertical-align: middle;
  }
  #qg-audit .qg-audit-empty {
    color: #888;
    font-size: 13px;
    padding: 20px;
    text-align: center;
    background: #fafafa;
    border-radius: 8px;
  }
  #qg-audit code {
    background: #f4f4f6;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
</style>

<div id="qg-audit">
  <div class="qg-audit-header">
    <h3>Recent activity</h3>
    <span class="qg-audit-meta" id="qg-audit-meta">Loading…</span>
  </div>

  <!-- Export toolbar. Uses window.qaApi (from dashboard-auth.snippet.html)
       to authenticate the admin-gated export endpoints. Only rendered if
       the auth guard is present and the user is admin OR operator; hidden
       otherwise. See design notes in server.py: audit exports are
       admin+operator (not admin-only) because operators generate the
       incident reports.
       Window options are relative to "now"; a "custom range" opens a
       small inline picker. -->
  <div class="qg-export-bar" id="qg-export-bar" style="display:none">
    <label style="font-size:12px;color:#555">Export</label>
    <select class="qg-export-range" id="qg-export-range">
      <option value="24">Last 24h</option>
      <option value="168" selected>Last 7 days</option>
      <option value="720">Last 30 days</option>
    </select>
    <button class="qg-export-btn" id="qg-export-csv">Download CSV</button>
    <button class="qg-export-btn" id="qg-export-pdf">Download PDF</button>
    <span class="qg-export-msg" id="qg-export-msg"></span>
  </div>

  <div id="qg-audit-body"></div>
</div>

<script>
(function () {
  var QUAKEGUARD_BACKEND = "https://quake-alert-18.emergent.host"; // no trailing /
  var LIMIT = 100;
  var POLL_MS = 10000;

  var body = document.getElementById("qg-audit-body");
  var meta = document.getElementById("qg-audit-meta");
  if (!body || !meta) return;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function sevColor(s) {
    if (s === "red")    return "#C21818";
    if (s === "yellow") return "#EA9500";
    if (s === "green")  return "#2E7D32";
    return "#666";
  }

  function formatEvent(e) {
    if (e.kind === "trigger") {
      var delivered = !!e.delivered;
      var badge =
        '<span class="qg-badge" style="background:' +
        (delivered ? "#1F8A3A" : "#C21818") + '">' +
        (delivered ? "delivered" : "FAILED") + "</span>";
      var mag = e.magnitude != null ? "M" + esc(e.magnitude) : "M?";
      var counts =
        "iOS " + (e.ios_count || 0) + " · Android " + (e.android_count || 0);
      var err = e.error
        ? '<div style="color:#c21818;font-size:12px;margin-top:4px"><b>Error:</b> ' + esc(e.error) + "</div>"
        : "";
      return (
        '<div class="qg-audit-row trigger">' +
          '<div class="qg-audit-title">' +
            '⚠️ TRIGGER ' + badge +
            ' · ' + mag + ' · ' + esc(e.recipients_total || 0) + ' device' + (e.recipients_total === 1 ? '' : 's') +
            ' (' + counts + ')' +
            ' · by <code>' + esc(e.triggered_by || "dashboard") + '</code>' +
          '</div>' +
          err +
          '<div class="qg-audit-at">' + esc(e.at || "") + '</div>' +
        '</div>'
      );
    }

    // ── rescued: responder-attested case closure ────────────────────────
    if (e.kind === "rescued") {
      var priorSev = e.prior_severity
        ? '<span class="qg-badge" style="background:' + sevColor(e.prior_severity) + '">' + esc(e.prior_severity) + '</span>'
        : "";
      // Notes rendering:
      //   • If /api/audit returned an actual `notes` string (admin-authed
      //     caller), render the note text verbatim.
      //   • If it only returned `notes_present: true` (public caller —
      //     the default for a public dashboard iframe), render a
      //     lock-icon placeholder that hints history exists without
      //     leaking content. Operators can view the note text via the
      //     admin-gated /api/admin/audit-log HTML view. This keeps free-
      //     form operator text out of the public feed by default, closing
      //     the "credential typed into notes" leak class (incident
      //     2026-08-04).
      var notes = "";
      if (e.notes) {
        notes = '<div style="color:#555;font-size:12px;margin-top:4px">📝 ' + esc(e.notes) + '</div>';
      } else if (e.notes_present) {
        notes = '<div style="color:#888;font-size:12px;margin-top:4px" title="Notes exist but are only visible to admin-authenticated viewers. Open /api/admin/audit-log to read.">🔒 <i>operator note recorded (admin-only)</i></div>';
      }
      return (
        '<div class="qg-audit-row rescued">' +
          '<div class="qg-audit-title">' +
            '✅ RESCUED · ' + renderIdent(e) +
            ' was <b>' + esc(e.prior_status || "trapped") + '</b>' + priorSev +
            ' · closed by <code>' + esc(e.rescued_by || "dashboard") + '</code>' +
          '</div>' +
          notes +
          '<div class="qg-audit-at">' + esc(e.at || "") + '</div>' +
        '</div>'
      );
    }

    // ── rescue_reverted: undo of a mark-rescued ─────────────────────────
    if (e.kind === "rescue_reverted") {
      var restoredSev = e.restored_severity
        ? '<span class="qg-badge" style="background:' + sevColor(e.restored_severity) + '">' + esc(e.restored_severity) + '</span>'
        : "";
      return (
        '<div class="qg-audit-row rescue_reverted">' +
          '<div class="qg-audit-title">' +
            '↩️ RESCUE REVERTED · ' + renderIdent(e) +
            ' restored to <b>' + esc(e.restored_status || e.status || "trapped") + '</b>' + restoredSev +
            ' · by <code>' + esc(e.reverted_by || "dashboard") + '</code>' +
          '</div>' +
          '<div class="qg-audit-at">' + esc(e.at || "") + '</div>' +
        '</div>'
      );
    }

    // ── status: mobile self-report ──────────────────────────────────────
    var sev = e.severity
      ? '<span class="qg-badge" style="background:' + sevColor(e.severity) + '">' + esc(e.severity) + "</span>"
      : "";
    var mob = e.mobility
      ? '<span class="qg-badge" style="background:' + (e.mobility === "trapped" ? "#C21818" : "#2E7D32") + '">' + (e.mobility === "trapped" ? "trapped/pinned" : "can move") + "</span>"
      : "";
    var loc = "";
    if (e.latitude != null && e.longitude != null) {
      loc = ' · <a href="https://www.google.com/maps/place/' +
            encodeURIComponent(e.latitude + "," + e.longitude) +
            '" target="_blank" rel="noopener">📍 map</a>';
    }
    var bat = e.battery_pct != null ? " · 🔋 " + esc(e.battery_pct) + "%" : "";
    return (
      '<div class="qg-audit-row status">' +
        '<div class="qg-audit-title">' +
          '📱 STATUS · ' + renderIdent(e) + " → " +
          '<b>' + esc(e.status || "") + '</b>' + sev + mob + loc + bat +
        '</div>' +
        '<div class="qg-audit-at">' + esc(e.at || "") + '</div>' +
      '</div>'
    );
  }

  /* renderIdent(e)
   *
   * Builds the human-readable device identifier chunk used in every audit
   * row. Prefers "<name> · <CODE>" when both are known, falls back to
   * "<CODE>" if only the code is known, and finally to the raw device_id
   * if the backend somehow shipped no short_code (pre-rollout rows). In
   * every case we hover-expose the full device_id via `title=` so an
   * operator can still copy it when needed.
   *
   * Kept as a single helper so all four event kinds render the identifier
   * identically — divergence between rows was the original problem this
   * feature solves.
   */
  function renderIdent(e) {
    var did = esc(e.device_id || "");
    var code = e.short_code ? esc(e.short_code) : "";
    var name = e.display_name ? esc(e.display_name) : "";
    if (name && code) {
      return '<b>' + name + '</b> · <code title="' + did + '">' + code + '</code>';
    }
    if (code) {
      return '<code title="' + did + '">' + code + '</code>';
    }
    return '<code>' + did + '</code>';
  }

  async function refresh() {
    try {
      // Use qaApi if available so an authenticated call is made — otherwise
      // fall back to anonymous fetch. The audit endpoint is public, but the
      // `notes` field is only included in the response when the caller is
      // authenticated (see the notes-behind-auth contract, task-#8-followup).
      // qaApi automatically attaches the JWT if the operator is signed in.
      var url = "/api/audit?limit=" + LIMIT;
      var res;
      if (window.qaApi) {
        res = await window.qaApi(url, {cache: "no-store"});
      } else {
        res = await fetch(QUAKEGUARD_BACKEND + url, {cache: "no-store"});
      }
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      var events = (data && data.events) || [];
      if (events.length === 0) {
        body.innerHTML = '<div class="qg-audit-empty">No activity yet.</div>';
      } else {
        body.innerHTML = events.map(formatEvent).join("");
      }
      meta.textContent = events.length + " events · updated " + new Date().toLocaleTimeString();
    } catch (e) {
      meta.textContent = "load error: " + (e && e.message ? e.message : e);
    }
  }

  refresh();
  setInterval(refresh, POLL_MS);

  // ─── Export toolbar (CSV + PDF) ─────────────────────────────────
  //
  // Uses window.qaApi from dashboard-auth.snippet.html so JWT-authed
  // admins/operators can download without pasting the X-Admin-Token.
  // If the auth guard isn't loaded, the toolbar stays hidden — falling
  // back to a token-input UI would create a second auth path that
  // isn't audit-logged the same way, and we want a single source of
  // truth for who exported what.
  //
  // We use a Blob → object-URL → anchor-click pattern rather than
  // window.open(), because window.open cannot attach Authorization
  // headers. The download filename comes from the server's
  // Content-Disposition header, but browsers only honor that on
  // same-origin — for cross-origin dashboard→backend we fall back to
  // computing the filename client-side (same format).
  var exportBar = document.getElementById("qg-export-bar");
  var exportRange = document.getElementById("qg-export-range");
  var exportCsvBtn = document.getElementById("qg-export-csv");
  var exportPdfBtn = document.getElementById("qg-export-pdf");
  var exportMsg = document.getElementById("qg-export-msg");

  function showExportMsg(kind, text) {
    if (!exportMsg) return;
    exportMsg.className = "qg-export-msg " + kind;
    exportMsg.textContent = text;
    if (kind === "success") setTimeout(function () {
      if (exportMsg.className.indexOf("success") !== -1) exportMsg.textContent = "";
    }, 4000);
  }

  function applyExportVisibility() {
    if (typeof window.qaApi !== "function" || typeof window.qaAuth !== "object") {
      exportBar.style.display = "none";
      return;
    }
    var u = window.qaAuth.user();
    if (u && (u.role === "admin" || u.role === "operator")) {
      exportBar.style.display = "flex";
    } else {
      exportBar.style.display = "none";
    }
  }

  async function doExport(kind /* "csv" | "pdf" */) {
    if (typeof window.qaApi !== "function") return;
    var hours = parseInt(exportRange.value, 10) || 168;
    // Compute since = now - hours; server defaults until = now.
    var since = new Date(Date.now() - hours * 3600 * 1000).toISOString();
    var path = "/api/admin/audit-log/export." + kind +
               "?since=" + encodeURIComponent(since);
    var btn = kind === "csv" ? exportCsvBtn : exportPdfBtn;
    btn.disabled = true;
    showExportMsg("", "Preparing…");
    try {
      var r = await window.qaApi(path);
      if (!r.ok) {
        var detail = "HTTP " + r.status;
        try {
          var body = await r.json();
          detail = body.detail || detail;
        } catch (_) { /* not JSON — leave HTTP N */ }
        showExportMsg("error", "Export failed: " + detail);
        return;
      }
      var rowCount = r.headers.get("X-Row-Count") || "?";
      var blob = await r.blob();
      var url = URL.createObjectURL(blob);
      // Try to extract server-supplied filename from Content-Disposition.
      // Cross-origin CORS often hides this header — fall back to a
      // client-computed name that matches the server's format.
      var cd = r.headers.get("Content-Disposition") || "";
      var m = /filename="([^"]+)"/.exec(cd);
      var stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"").replace("T","T");
      var filename = m ? m[1] : ("quakeangel-audit-" + stamp + "." + kind);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      // Revoke the blob URL after a short delay so Safari has time to
      // actually initiate the download before the URL becomes invalid.
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      showExportMsg("success", "Downloaded " + rowCount + " row(s).");
    } catch (e) {
      showExportMsg("error", "Export failed: " + (e && e.message ? e.message : e));
    } finally {
      btn.disabled = false;
    }
  }

  if (exportCsvBtn) exportCsvBtn.addEventListener("click", function () { doExport("csv"); });
  if (exportPdfBtn) exportPdfBtn.addEventListener("click", function () { doExport("pdf"); });

  applyExportVisibility();
  if (window.qaAuth && typeof window.qaAuth.onChange === "function") {
    window.qaAuth.onChange(applyExportVisibility);
  }
})();
</script>
