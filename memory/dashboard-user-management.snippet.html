<!-- ═════════════════════════════════════════════════════════════════════
     Quake Angel dashboard — User Management panel
     ═════════════════════════════════════════════════════════════════════

     Paste this snippet inside the dashboard <body>, AFTER
     `dashboard-auth.snippet.html` has been loaded (this snippet uses
     `window.qaApi` and `window.qaAuth` from that guard).

     Provides:

       • A collapsible "Operators & Access" panel (default: collapsed).
       • Full CRUD for the users allowlist:
           - Add operator (email + role radio)
           - Change role (admin ↔ operator)
           - Disable / re-enable (soft — preserves audit trail)
           - Extend expiry by 90 days (one-click)
           - Set custom expiry date, or "never expires"
           - Delete (with confirmation + last-admin safety rail)
       • Live rendering — after any mutation the table re-fetches so
         the UI is always in sync with the backend, no manual reload.
       • Every destructive action requires a typed confirmation of
         the target email — mirrors GitHub's repo-delete pattern.
       • Visible only to admins (`window.qaAuth.user().role === 'admin'`).
         Operators see nothing at all — no panel, no button, no hint.
         The backend enforces this too (`require_role(admin)` on every
         endpoint) so the visual hiding is defense-in-depth, not the
         primary guard.

     Backend endpoints called:
       GET    /api/admin/users
       POST   /api/admin/users
       PATCH  /api/admin/users/{email}
       POST   /api/admin/users/{email}/disable
       POST   /api/admin/users/{email}/enable
       POST   /api/admin/users/{email}/extend
       DELETE /api/admin/users/{email}

     Style: minimal inline CSS in a <style> block scoped by class
     prefix `qa-um-` to avoid clashing with the rest of the dashboard.
     ═════════════════════════════════════════════════════════════════════ -->

<style>
  .qa-um-panel {
    margin: 24px 0;
    padding: 16px;
    background: #f8f9fb;
    border: 1px solid #d9dde3;
    border-radius: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .qa-um-panel h2 {
    margin: 0 0 4px 0;
    font-size: 17px;
    font-weight: 600;
    color: #1a1a1a;
    cursor: pointer;
    user-select: none;
  }
  .qa-um-panel h2::before {
    content: "▸ ";
    display: inline-block;
    width: 14px;
    transition: transform 0.15s ease;
  }
  .qa-um-panel.qa-um-open h2::before {
    transform: rotate(90deg);
  }
  .qa-um-panel .qa-um-subtitle {
    font-size: 12px;
    color: #666;
    margin: 0 0 12px 0;
  }
  .qa-um-panel .qa-um-body {
    display: none;
    margin-top: 12px;
  }
  .qa-um-panel.qa-um-open .qa-um-body { display: block; }

  .qa-um-table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    font-size: 13px;
    border: 1px solid #e0e3e8;
    border-radius: 6px;
    overflow: hidden;
  }
  .qa-um-table th, .qa-um-table td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid #eef0f4;
    vertical-align: middle;
  }
  .qa-um-table th {
    background: #f0f2f6;
    font-size: 11px;
    font-weight: 600;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .qa-um-table tr:last-child td { border-bottom: none; }
  .qa-um-table tr.qa-um-self { background: #fffbea; }
  .qa-um-table tr.qa-um-expired { background: #ffefef; }
  .qa-um-table tr.qa-um-disabled { opacity: 0.55; }

  .qa-um-role-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .qa-um-role-badge.admin   { background: #fbe6e6; color: #a01717; }
  .qa-um-role-badge.operator{ background: #e0eeff; color: #0f4d99; }

  .qa-um-status-chip {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    margin-right: 4px;
  }
  .qa-um-status-chip.active   { background: #e6f7ea; color: #1a7f37; }
  .qa-um-status-chip.disabled { background: #ffebeb; color: #b0141a; }
  .qa-um-status-chip.expired  { background: #fff0e1; color: #ba4700; }

  .qa-um-action-btn {
    display: inline-block;
    padding: 4px 9px;
    margin-right: 4px;
    margin-bottom: 4px;
    background: #fff;
    border: 1px solid #cbd0d8;
    border-radius: 4px;
    font-size: 11px;
    color: #333;
    cursor: pointer;
    font-family: inherit;
  }
  .qa-um-action-btn:hover:not(:disabled) { background: #f0f2f6; border-color: #a8b0bd; }
  .qa-um-action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .qa-um-action-btn.qa-um-danger        { color: #b0141a; border-color: #f0c9c9; }
  .qa-um-action-btn.qa-um-danger:hover:not(:disabled) { background: #ffefef; border-color: #d99999; }
  .qa-um-action-btn.qa-um-primary       { background: #0f4d99; color: #fff; border-color: #0f4d99; }
  .qa-um-action-btn.qa-um-primary:hover:not(:disabled) { background: #0d3e7d; }

  .qa-um-add-form {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    margin-bottom: 12px;
    background: #fff;
    border: 1px solid #e0e3e8;
    border-radius: 6px;
    flex-wrap: wrap;
  }
  .qa-um-add-form input[type="email"] {
    flex: 1;
    min-width: 220px;
    padding: 6px 10px;
    border: 1px solid #cbd0d8;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
  }
  .qa-um-add-form label { font-size: 13px; color: #333; margin-right: 4px; }
  .qa-um-add-form input[type="radio"] { margin-right: 3px; vertical-align: -1px; }

  .qa-um-msg {
    padding: 8px 12px;
    border-radius: 4px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .qa-um-msg.error   { background: #ffefef; color: #b0141a; border: 1px solid #f0c9c9; }
  .qa-um-msg.success { background: #e6f7ea; color: #1a7f37; border: 1px solid #b8e2c4; }

  .qa-um-modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center; justify-content: center;
    z-index: 9999;
  }
  .qa-um-modal-bg.qa-um-show { display: flex; }
  .qa-um-modal {
    background: #fff;
    padding: 20px 22px;
    border-radius: 8px;
    max-width: 460px;
    width: 90%;
    font-family: inherit;
  }
  .qa-um-modal h3 { margin: 0 0 8px 0; font-size: 16px; font-weight: 600; }
  .qa-um-modal p  { margin: 0 0 12px 0; font-size: 13px; color: #333; line-height: 1.5; }
  .qa-um-modal input[type="text"], .qa-um-modal input[type="datetime-local"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #cbd0d8;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
    box-sizing: border-box;
    margin-bottom: 12px;
  }
  .qa-um-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
</style>

<div id="qa-um-root" class="qa-um-panel" style="display:none">
  <h2 id="qa-um-toggle">Operators &amp; Access</h2>
  <div class="qa-um-subtitle">
    Add operators, change roles, and manage 90-day account expiry. Admin-only.
  </div>
  <div class="qa-um-body">
    <div id="qa-um-msg-slot"></div>

    <form class="qa-um-add-form" id="qa-um-add-form" onsubmit="return false">
      <input type="email" id="qa-um-add-email" placeholder="new.operator@example.com" required />
      <label><input type="radio" name="qa-um-add-role" value="operator" checked> Operator</label>
      <label><input type="radio" name="qa-um-add-role" value="admin"> Admin</label>
      <button type="submit" class="qa-um-action-btn qa-um-primary" id="qa-um-add-submit">
        Add operator
      </button>
    </form>

    <table class="qa-um-table" id="qa-um-table">
      <thead>
        <tr>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Expires</th>
          <th>Last login</th>
          <th style="min-width:200px">Actions</th>
        </tr>
      </thead>
      <tbody id="qa-um-tbody">
        <tr><td colspan="6" style="padding:16px;text-align:center;color:#888">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Confirmation modal — reused for delete + custom-expiry -->
<div class="qa-um-modal-bg" id="qa-um-modal-bg">
  <div class="qa-um-modal">
    <h3 id="qa-um-modal-title">Confirm</h3>
    <p id="qa-um-modal-body"></p>
    <input type="text" id="qa-um-modal-input" style="display:none" autocomplete="off" />
    <input type="datetime-local" id="qa-um-modal-datetime" style="display:none" />
    <div class="qa-um-modal-actions">
      <button class="qa-um-action-btn" id="qa-um-modal-cancel">Cancel</button>
      <button class="qa-um-action-btn qa-um-primary" id="qa-um-modal-confirm">Confirm</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Defensive: this snippet requires the auth guard. Fail-loud in the
  // console rather than silently render a broken UI.
  if (typeof window.qaApi !== 'function' || typeof window.qaAuth !== 'object') {
    console.error('[qa-user-mgmt] Requires dashboard-auth.snippet.html to be loaded first.');
    return;
  }

  const root      = document.getElementById('qa-um-root');
  const toggleEl  = document.getElementById('qa-um-toggle');
  const tbody     = document.getElementById('qa-um-tbody');
  const msgSlot   = document.getElementById('qa-um-msg-slot');
  const addForm   = document.getElementById('qa-um-add-form');
  const addEmail  = document.getElementById('qa-um-add-email');
  const addSubmit = document.getElementById('qa-um-add-submit');
  const modalBg    = document.getElementById('qa-um-modal-bg');
  const modalTitle = document.getElementById('qa-um-modal-title');
  const modalBody  = document.getElementById('qa-um-modal-body');
  const modalInput = document.getElementById('qa-um-modal-input');
  const modalDate  = document.getElementById('qa-um-modal-datetime');
  const modalCancel  = document.getElementById('qa-um-modal-cancel');
  const modalConfirm = document.getElementById('qa-um-modal-confirm');

  // ─── Utilities ─────────────────────────────────────────────────────

  function h(str) {
    // Minimal HTML escape for values we splice into innerHTML.
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function showMsg(kind, text) {
    msgSlot.innerHTML = '<div class="qa-um-msg ' + kind + '">' + h(text) + '</div>';
    if (kind === 'success') {
      setTimeout(function () {
        if (msgSlot.querySelector('.success')) msgSlot.innerHTML = '';
      }, 4000);
    }
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      const now = new Date();
      const days = Math.round((d - now) / 86400000);
      const dateStr = d.toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
      if (Math.abs(days) < 1) return dateStr + ' (today)';
      if (days > 0 && days <= 30) return dateStr + ' (in ' + days + 'd)';
      if (days < 0) return dateStr + ' (' + Math.abs(days) + 'd ago)';
      return dateStr;
    } catch (_) { return iso; }
  }

  // ─── Modal (promise-based) ────────────────────────────────────────

  let pendingResolve = null;
  function closeModal(value) {
    modalBg.classList.remove('qa-um-show');
    modalInput.style.display = 'none';
    modalDate.style.display  = 'none';
    modalInput.value = '';
    modalDate.value  = '';
    if (pendingResolve) {
      const r = pendingResolve;
      pendingResolve = null;
      r(value);
    }
  }
  modalCancel.addEventListener('click', function () { closeModal(null); });
  modalBg.addEventListener('click', function (e) {
    if (e.target === modalBg) closeModal(null);
  });

  function confirmTyping(title, body, expectedString) {
    // Modal that requires typing an expected string (the email being
    // deleted, typically). Prevents muscle-memory misclicks.
    return new Promise(function (resolve) {
      modalTitle.textContent = title;
      modalBody.textContent  = body;
      modalInput.style.display = 'block';
      modalInput.placeholder = 'Type: ' + expectedString;
      modalDate.style.display = 'none';
      modalBg.classList.add('qa-um-show');
      pendingResolve = resolve;
      modalConfirm.textContent = 'Confirm';
      modalConfirm.onclick = function () {
        if (modalInput.value.trim() === expectedString) {
          closeModal(true);
        } else {
          modalInput.style.borderColor = '#b0141a';
          setTimeout(function () { modalInput.style.borderColor = ''; }, 800);
        }
      };
      setTimeout(function () { modalInput.focus(); }, 50);
    });
  }

  function chooseDatetime(title, body, defaultIsoDays) {
    // Modal to pick a datetime for setting a custom expiry.
    return new Promise(function (resolve) {
      modalTitle.textContent = title;
      modalBody.textContent  = body;
      modalInput.style.display = 'none';
      modalDate.style.display  = 'block';
      const def = new Date(Date.now() + defaultIsoDays * 86400000);
      // Format for datetime-local input (local time, no seconds/tz):
      const pad = function (n) { return String(n).padStart(2, '0'); };
      modalDate.value =
        def.getFullYear() + '-' + pad(def.getMonth()+1) + '-' + pad(def.getDate()) +
        'T' + pad(def.getHours()) + ':' + pad(def.getMinutes());
      modalBg.classList.add('qa-um-show');
      pendingResolve = resolve;
      modalConfirm.textContent = 'Set expiry';
      modalConfirm.onclick = function () {
        if (!modalDate.value) return;
        const d = new Date(modalDate.value);   // interpreted as local time
        closeModal(d.toISOString());
      };
    });
  }

  // ─── Data + rendering ────────────────────────────────────────────

  async function fetchUsers() {
    const r = await window.qaApi('/api/admin/users');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    return data.users || [];
  }

  function renderRow(u, selfEmail) {
    const isSelf = (u.email || '').toLowerCase() === (selfEmail || '').toLowerCase();
    const rowClass =
      (isSelf ? 'qa-um-self ' : '') +
      (u.is_expired && !u.disabled ? 'qa-um-expired ' : '') +
      (u.disabled ? 'qa-um-disabled ' : '');
    const chips = [];
    if (u.disabled)  chips.push('<span class="qa-um-status-chip disabled">Disabled</span>');
    else if (u.is_expired) chips.push('<span class="qa-um-status-chip expired">Expired</span>');
    else             chips.push('<span class="qa-um-status-chip active">Active</span>');
    if (isSelf) chips.push('<span class="qa-um-status-chip" style="background:#fff4bd;color:#7a5c00">You</span>');

    // Actions:
    //   Change role (opposite of current) — hidden for self (self-demotion guard)
    //   Disable / Enable
    //   Extend expiry
    //   Set custom expiry
    //   Never expires (only if currently has expiry)
    //   Delete (with typed confirmation)
    const otherRole = u.role === 'admin' ? 'operator' : 'admin';
    const buttons = [];
    if (!isSelf) {
      buttons.push('<button class="qa-um-action-btn" data-act="role" data-email="' + h(u.email) + '" data-newrole="' + otherRole + '">Make ' + otherRole + '</button>');
    }
    if (u.disabled) {
      buttons.push('<button class="qa-um-action-btn" data-act="enable" data-email="' + h(u.email) + '">Re-enable</button>');
    } else if (!isSelf) {
      buttons.push('<button class="qa-um-action-btn" data-act="disable" data-email="' + h(u.email) + '">Disable</button>');
    }
    buttons.push('<button class="qa-um-action-btn" data-act="extend" data-email="' + h(u.email) + '">Extend +90d</button>');
    buttons.push('<button class="qa-um-action-btn" data-act="expiry" data-email="' + h(u.email) + '">Set expiry…</button>');
    if (u.expires_at) {
      buttons.push('<button class="qa-um-action-btn" data-act="never" data-email="' + h(u.email) + '">Never expires</button>');
    }
    if (!isSelf) {
      buttons.push('<button class="qa-um-action-btn qa-um-danger" data-act="delete" data-email="' + h(u.email) + '">Delete</button>');
    }

    return '<tr class="' + rowClass.trim() + '">' +
      '<td>' + h(u.display_name || u.email) +
        (u.display_name && u.display_name !== u.email
          ? '<div style="font-size:11px;color:#888">' + h(u.email) + '</div>' : '') +
      '</td>' +
      '<td><span class="qa-um-role-badge ' + u.role + '">' + h(u.role) + '</span></td>' +
      '<td>' + chips.join(' ') + '</td>' +
      '<td>' + (u.expires_at ? h(fmtDate(u.expires_at)) : '<span style="color:#888">never</span>') + '</td>' +
      '<td>' + (u.last_login_at ? h(fmtDate(u.last_login_at)) : '<span style="color:#888">never</span>') + '</td>' +
      '<td>' + buttons.join('') + '</td>' +
      '</tr>';
  }

  async function refresh() {
    try {
      const users = await fetchUsers();
      const self  = window.qaAuth.user() || {};
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="padding:16px;text-align:center;color:#888">No operators yet.</td></tr>';
      } else {
        tbody.innerHTML = users.map(function (u) { return renderRow(u, self.email); }).join('');
      }
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="6" style="padding:16px;text-align:center;color:#b0141a">Load failed: ' + h(e.message) + '</td></tr>';
    }
  }

  // ─── Actions dispatcher ──────────────────────────────────────────

  async function doAction(act, email, extra) {
    let r;
    try {
      if (act === 'role') {
        r = await window.qaApi('/api/admin/users/' + encodeURIComponent(email), {
          method: 'PATCH',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({role: extra.newrole}),
        });
      } else if (act === 'disable') {
        r = await window.qaApi('/api/admin/users/' + encodeURIComponent(email) + '/disable', {method:'POST'});
      } else if (act === 'enable') {
        r = await window.qaApi('/api/admin/users/' + encodeURIComponent(email) + '/enable', {method:'POST'});
      } else if (act === 'extend') {
        r = await window.qaApi('/api/admin/users/' + encodeURIComponent(email) + '/extend', {method:'POST'});
      } else if (act === 'expiry') {
        r = await window.qaApi('/api/admin/users/' + encodeURIComponent(email), {
          method: 'PATCH',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({expires_at: extra.iso}),
        });
      } else if (act === 'never') {
        r = await window.qaApi('/api/admin/users/' + encodeURIComponent(email), {
          method: 'PATCH',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({expires_at: 'never'}),
        });
      } else if (act === 'delete') {
        r = await window.qaApi('/api/admin/users/' + encodeURIComponent(email), {method:'DELETE'});
      }
      if (!r.ok) {
        const detail = await r.json().catch(function () { return {detail:'HTTP ' + r.status}; });
        showMsg('error', 'Failed: ' + (detail.detail || ('HTTP ' + r.status)));
      } else {
        showMsg('success', 'Done.');
        await refresh();
      }
    } catch (e) {
      showMsg('error', 'Failed: ' + e.message);
    }
  }

  // ─── Event wiring ────────────────────────────────────────────────

  toggleEl.addEventListener('click', function () {
    root.classList.toggle('qa-um-open');
    if (root.classList.contains('qa-um-open')) refresh();
  });

  addForm.addEventListener('submit', async function () {
    const email = addEmail.value.trim();
    const role  = document.querySelector('input[name="qa-um-add-role"]:checked').value;
    if (!email || email.indexOf('@') === -1) {
      showMsg('error', 'Enter a valid email.');
      return;
    }
    addSubmit.disabled = true;
    try {
      const r = await window.qaApi('/api/admin/users', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email: email, role: role}),
      });
      if (!r.ok) {
        const detail = await r.json().catch(function () { return {detail:'HTTP ' + r.status}; });
        showMsg('error', 'Add failed: ' + (detail.detail || ('HTTP ' + r.status)));
      } else {
        showMsg('success', 'Added ' + email + '.');
        addEmail.value = '';
        await refresh();
      }
    } catch (e) {
      showMsg('error', 'Add failed: ' + e.message);
    } finally {
      addSubmit.disabled = false;
    }
  });

  tbody.addEventListener('click', async function (e) {
    const btn = e.target.closest('button.qa-um-action-btn');
    if (!btn) return;
    const act   = btn.getAttribute('data-act');
    const email = btn.getAttribute('data-email');
    if (!act || !email) return;

    if (act === 'delete') {
      const ok = await confirmTyping(
        'Delete ' + email + '?',
        'This permanently removes the user from the allowlist. Their historical audit rows remain, but they lose all access immediately. Type the full email to confirm.',
        email
      );
      if (ok) await doAction('delete', email);
    } else if (act === 'expiry') {
      const iso = await chooseDatetime(
        'Set expiry for ' + email,
        'Pick the date/time after which this account can no longer sign in. Times are local to your browser.',
        90   // default: 90 days from now
      );
      if (iso) await doAction('expiry', email, {iso: iso});
    } else if (act === 'role') {
      const newrole = btn.getAttribute('data-newrole');
      const ok = await confirmTyping(
        'Change ' + email + ' to ' + newrole + '?',
        (newrole === 'admin'
          ? 'Admins can add, disable, and delete other operators. Grant sparingly. Type the full email to confirm.'
          : 'Demoting from admin to operator removes their user-management access. Type the full email to confirm.'),
        email
      );
      if (ok) await doAction('role', email, {newrole: newrole});
    } else {
      // disable / enable / extend / never — no extra confirmation needed
      await doAction(act, email);
    }
  });

  // ─── Visibility gating (defense in depth — backend enforces too) ─

  function applyVisibility() {
    const u = window.qaAuth.user();
    if (u && u.role === 'admin') {
      root.style.display = 'block';
    } else {
      root.style.display = 'none';
      root.classList.remove('qa-um-open');
    }
  }
  applyVisibility();
  window.qaAuth.onChange(applyVisibility);
})();
</script>
