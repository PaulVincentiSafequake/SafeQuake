<!--
  QuakeGuard — "Trigger Earthquake Alert" button snippet.

  HOW TO USE
  ----------
  1. Paste this entire block into any page on your safequake.onrender.com
     dashboard where you want the emergency-personnel button to appear.
  2. Replace the value of QUAKEGUARD_BACKEND below with the deployed URL of
     the QuakeGuard FastAPI backend (visible under Emergent → Publish →
     Deploy). It must end with /api/trigger-alert being reachable at that
     origin — i.e. your backend base URL, without a trailing slash.
     Example: "https://quake-alert-18.emergent.host"
  3. The password prompt matches the ADMIN_TRIGGER_PASSWORD env var on the
     backend. Change the password by editing that env var (Deployment panel
     → Secrets tab) — no code changes needed here.

  SECURITY NOTES
  --------------
  - The password is entered by the operator in the browser prompt and sent
    as `X-Admin-Token` on a single POST. Nothing is stored anywhere.
  - This is a *simple* protection to stop random visitors, not a full auth
    system. Anyone with the password can trigger an alert. Rotate the env
    var if you suspect it's been shared.
-->

<style>
  #qg-trigger-wrap {
    position: relative;
    display: inline-block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #qg-trigger-btn {
    background: #FF3B30;
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: none;
    border-radius: 12px;
    padding: 14px 22px;
    cursor: pointer;
    box-shadow: 0 6px 22px rgba(255, 59, 48, 0.35);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: transform .08s ease, opacity .15s ease;
  }
  #qg-trigger-btn:hover { transform: translateY(-1px); }
  #qg-trigger-btn:active { transform: translateY(0); opacity: .9; }
  #qg-trigger-btn[disabled] { opacity: .55; cursor: not-allowed; }
  #qg-trigger-status {
    display: block;
    margin-top: 10px;
    font-size: 13px;
    min-height: 18px;
  }
  #qg-trigger-status.ok    { color: #1F8A3A; }
  #qg-trigger-status.err   { color: #C21818; }
  #qg-trigger-status.info  { color: #666; }
</style>

<div id="qg-trigger-wrap">
  <button id="qg-trigger-btn" type="button" aria-label="Trigger earthquake alert">
    <span aria-hidden="true">⚠️</span>
    Trigger Earthquake Alert
  </button>
  <span id="qg-trigger-status" role="status" aria-live="polite"></span>
</div>

<script>
(function () {
  // === EDIT THIS ==========================================================
  var QUAKEGUARD_BACKEND = "https://quake-alert-18.emergent.host"; // no trailing /
  // ========================================================================

  var btn    = document.getElementById("qg-trigger-btn");
  var status = document.getElementById("qg-trigger-status");
  if (!btn || !status) return;

  function setStatus(msg, kind) {
    status.textContent = msg || "";
    status.className = kind || "";
  }

  btn.addEventListener("click", async function () {
    var confirmed = window.confirm(
      "Broadcast an EARTHQUAKE ALERT to every registered device?\n\n" +
      "This will push a critical notification to all installed apps and " +
      "flip their dashboard status to 'not responding' until they mark " +
      "themselves safe."
    );
    if (!confirmed) return;

    var pwd = window.prompt("Enter emergency personnel password:");
    if (!pwd) { setStatus("Cancelled.", "info"); return; }

    btn.disabled = true;
    setStatus("Broadcasting…", "info");

    try {
      var res = await fetch(QUAKEGUARD_BACKEND + "/api/trigger-alert", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Token": pwd
        },
        body: JSON.stringify({
          triggeredBy: "dashboard",
          magnitude: 6.4,
          distance_km: 12,
          intensity: "VII"
        })
      });

      if (res.status === 401) {
        setStatus("Wrong password. Alert not sent.", "err");
        return;
      }
      if (!res.ok) {
        setStatus("Server error (" + res.status + "). Alert not sent.", "err");
        return;
      }
      var data = await res.json();
      var n = (data && typeof data.recipients === "number") ? data.recipients : "?";
      var delivered = data && data.push_delivered;
      setStatus(
        "Alert broadcast to " + n + " device" + (n === 1 ? "" : "s") +
        (delivered === false
          ? " (push queued — check EMERGENT_PUSH_KEY on the backend if this persists)."
          : "."),
        "ok"
      );
    } catch (e) {
      setStatus("Network error: " + (e && e.message ? e.message : e), "err");
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
